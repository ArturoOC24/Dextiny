<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dextiny</title>
<style>
  :root {
    --bg: #eef2f7;
    --card: #ffffff;
    --text: #1a2233;
    --muted: #6b7688;
    --border: #dfe4ec;
    --accent: #e3350d;
    --accent-2: #2a75bb;
    --shadow: 0 10px 30px rgba(20, 30, 60, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --card: #1b1f29;
      --text: #eef1f6;
      --muted: #98a1b3;
      --border: #2a2f3b;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  header { text-align: center; margin: 20px 0 28px; }
  h1 {
    margin: 0;
    font-size: clamp(28px, 6vw, 44px);
    letter-spacing: -1px;
  }
  h1 .poke { color: var(--accent); }
  h1 .hash { color: var(--accent-2); }
  header p { color: var(--muted); margin: 8px 0 0; font-size: 15px; }

  .panel {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 22px;
  }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  input[type=text], input[type=date] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: var(--accent-2); }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 18px; padding: 4px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
  }
  .tabs button {
    flex: 1; min-width: 0; padding: 9px 6px; border: none; background: transparent;
    color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer;
    border-radius: 8px; transition: all .15s; white-space: nowrap;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { background: var(--accent); color: #fff; }

  .mode { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .mode button {
    flex: 1;
    min-width: 90px;
    padding: 9px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .mode button.active {
    background: var(--accent-2);
    border-color: var(--accent-2);
    color: #fff;
  }

  .opts { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .link-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer;
  }
  .link-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }

  .actions { display: flex; gap: 8px; }
  .go {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: filter .15s;
  }
  .go:hover { filter: brightness(1.05); }
  .go:disabled { opacity: .6; cursor: default; }
  .rand {
    padding: 13px 16px; border: 1px solid var(--border); border-radius: 10px;
    background: transparent; color: var(--text); font-size: 18px; cursor: pointer;
  }
  .rand:hover { border-color: var(--accent-2); }

  .divider {
    width: 100%; max-width: 460px; margin: 20px 0 2px; text-align: center;
    position: relative; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
  }
  .divider::before {
    content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border);
  }
  .divider span { position: relative; background: var(--bg); padding: 0 12px; }

  select {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 15px; outline: none; cursor: pointer;
    transition: border-color .15s;
  }
  select:focus { border-color: var(--accent-2); }
  .browse-hint { font-size: 12px; color: var(--muted); margin: 0 0 16px; line-height: 1.5; }

  .result-card {
    width: 100%; max-width: 460px; margin-top: 22px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow); padding: 16px;
  }
  .subselect { display: flex; gap: 8px; margin-bottom: 14px; }
  .subselect select { flex: 1; }
  .subselect .rand { padding: 0 16px; }
  .result {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: none;
  }
  .result.show { display: block; }
  .result-top {
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    padding: 20px;
    text-align: center;
    color: #fff;
    position: relative;
  }
  .result-top img { width: 180px; height: 180px; image-rendering: pixelated; filter: drop-shadow(0 6px 8px rgba(0,0,0,.25)); }
  .dexnum { font-size: 13px; opacity: .9; letter-spacing: 2px; }
  .name { font-size: 30px; font-weight: 800; text-transform: capitalize; margin: 2px 0 0; }
  .genus { font-size: 13px; opacity: .9; margin-top: 2px; }
  .hashline { font-size: 12px; opacity: .85; margin-top: 6px; font-family: monospace; }
  .card-btn {
    position: absolute; top: 14px;
    display: flex; align-items: center; justify-content: center; line-height: 1;
    width: 44px; height: 44px; border-radius: 50%; padding: 0;
    border: 1.5px solid rgba(255,255,255,.7); background: rgba(0,0,0,.22);
    color: #fff; font-size: 18px; cursor: pointer; z-index: 5;
    transition: background .15s, transform .1s;
  }
  .card-btn > span { pointer-events: none; }
  .card-btn:hover { background: rgba(0,0,0,.38); }
  .card-btn:active { transform: scale(.92); }
  .cry-btn { right: 14px; }
  .shiny-btn { left: 14px; }
  .shiny-btn.active { background: #fff; color: var(--accent); border-color: #fff; }

  .flavor { padding: 16px 20px 4px; font-size: 14px; line-height: 1.5; color: var(--text); text-align: center; font-style: italic; }
  .types { display: flex; gap: 8px; justify-content: center; padding: 16px; flex-wrap: wrap; }
  .type-badge {
    padding: 5px 14px; border-radius: 999px; color: #fff; font-size: 12px;
    font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  }
  .stats { padding: 4px 20px 20px; }
  .stat { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
  .stat .sname { width: 110px; color: var(--muted); text-transform: capitalize; }
  .stat .sval { width: 34px; text-align: right; font-weight: 700; }
  .bar { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent-2); border-radius: 4px; transition: width .5s ease; }
  .meta { display: flex; justify-content: space-around; padding: 14px 20px; border-top: 1px solid var(--border); font-size: 13px; }
  .meta div { text-align: center; }
  .meta .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .meta .v { font-weight: 700; margin-top: 2px; text-transform: capitalize; }

  .share-bar { padding: 4px 20px 20px; border-top: 1px solid var(--border); display: flex; justify-content: center; }
  .share-btn {
    margin-top: 16px; width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s;
  }
  .share-btn:hover { border-color: var(--accent-2); color: var(--accent-2); }

  .msg { text-align: center; color: var(--muted); padding: 30px; font-size: 15px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { margin-top: 30px; color: var(--muted); font-size: 12px; text-align: center; }
  footer a { color: var(--accent-2); }
</style>
</head>
<body>
  <header>
    <h1><span class="poke">Dex</span><span class="hash">tiny</span></h1>
    <p>Discover the Pokémon written in your name and birthday.</p>
  </header>

  <!-- Input form -->
  <div class="panel">
    <div class="mode" id="mode">
      <button data-mode="name" class="active">Name</button>
      <button data-mode="bday">Birthday</button>
      <button data-mode="both">Name + Birthday</button>
    </div>
    <div class="field" id="field-name">
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="e.g. Ash Ketchum" autocomplete="off" />
    </div>
    <div class="field" id="field-bday" style="display:none">
      <label for="bday">Birthday</label>
      <input id="bday" type="date" />
    </div>
    <div class="actions">
      <button class="go" id="go">Reveal my Pokémon</button>
      <button class="rand" id="rand" title="Random">🎲</button>
    </div>
  </div>

  <!-- Result: tabs let you re-slice the reveal by pool -->
  <div class="result-card" id="resultCard">
    <div class="tabs" id="tabs">
      <button data-tab="you" class="active">By You</button>
      <button data-tab="generation">By Gen</button>
      <button data-tab="region">By Region</button>
      <button data-tab="game">By Game</button>
    </div>

    <div class="subselect" id="subselect" style="display:none">
      <select id="browseValue"><option>Loading…</option></select>
      <button class="rand" id="browseRand" title="Random from this pool">🎲</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    Data from <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a>.
    Same input always gives the same Pokémon.
  </footer>

<script>
  const DEX_MAX = 1025;

  const TYPE_COLORS = {
    normal:"#A8A77A", fire:"#EE8130", water:"#6390F0", electric:"#F7D02C",
    grass:"#7AC74C", ice:"#96D9D6", fighting:"#C22E28", poison:"#A33EA1",
    ground:"#E2BF65", flying:"#A98FF3", psychic:"#F95587", bug:"#A6B91A",
    rock:"#B6A136", ghost:"#735797", dragon:"#6F35FC", dark:"#705746",
    steel:"#B7B7CE", fairy:"#D685AD"
  };

  let mode = "name";
  let currentCry = null;
  let shinyState = false;
  let currentData = null; // { p, species, hash, dexId }

  // Deterministic string hash (FNV-1a, 32-bit)
  function hashString(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }

  function buildInput() {
    const name = document.getElementById("name").value.trim().toLowerCase();
    const bday = document.getElementById("bday").value;
    if (mode === "name") return name;
    if (mode === "bday") return bday;
    return name + "|" + bday;
  }

  function inputValid() {
    const name = document.getElementById("name").value.trim();
    const bday = document.getElementById("bday").value;
    if (mode === "name") return !!name;
    if (mode === "bday") return !!bday;
    return !!name && !!bday;
  }

  function setMode(m) {
    mode = m;
    document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("active", b.dataset.mode === m));
    document.getElementById("field-name").style.display = (m === "bday") ? "none" : "";
    document.getElementById("field-bday").style.display = (m === "name") ? "none" : "";
  }

  document.getElementById("mode").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (btn) setMode(btn.dataset.mode);
  });

  const resultEl = document.getElementById("result");

  function toast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  async function reveal() {
    if (!inputValid()) {
      setTabVisual("you");
      resultEl.className = "result show";
      resultEl.innerHTML = '<div class="msg">Please fill in the field(s) above first.</div>';
      return;
    }
    const hash = hashString(buildInput());
    const dexId = (hash % DEX_MAX) + 1;
    youResult = { id: dexId, hash };
    setTabVisual("you");
    await showPokemon(dexId, hash);
  }

  async function showPokemon(dexId, hash) {
    const go = document.getElementById("go");
    go.disabled = true;
    resultEl.className = "result show";
    resultEl.innerHTML = '<div class="msg">Summoning #' + dexId + '…</div>';

    try {
      const [pRes, sRes] = await Promise.all([
        fetch("https://pokeapi.co/api/v2/pokemon/" + dexId),
        fetch("https://pokeapi.co/api/v2/pokemon-species/" + dexId)
      ]);
      if (!pRes.ok) throw new Error("HTTP " + pRes.status);
      const p = await pRes.json();
      const species = sRes.ok ? await sRes.json() : null;
      currentData = { p, species, hash, dexId };
      render();
    } catch (err) {
      resultEl.innerHTML = '<div class="msg">Could not reach PokéAPI (' + err.message + '). Check your connection and try again.</div>';
    } finally {
      go.disabled = false;
    }
  }

  function render() {
    if (!currentData) return;
    const { p, species, hash, dexId } = currentData;
    const shiny = shinyState;
    const art = p.sprites.other["official-artwork"] || {};
    const sprite = (shiny ? art.front_shiny : art.front_default) || p.sprites.front_default || "";

    const types = p.types.map(t => {
      const n = t.type.name;
      return '<span class="type-badge" style="background:' + (TYPE_COLORS[n] || "#777") + '">' + n + '</span>';
    }).join("");

    const stats = p.stats.map(s => {
      const val = s.base_stat;
      const pct = Math.min(100, (val / 200) * 100);
      const label = s.stat.name.replace("special-attack","sp. atk").replace("special-defense","sp. def");
      return '<div class="stat"><span class="sname">' + label + '</span>' +
        '<span class="sval">' + val + '</span>' +
        '<span class="bar"><span style="width:' + pct + '%"></span></span></div>';
    }).join("");

    // Species extras
    let genus = "", flavor = "";
    if (species) {
      const g = (species.genera || []).find(x => x.language.name === "en");
      genus = g ? g.genus : "";
      const f = (species.flavor_text_entries || []).find(x => x.language.name === "en");
      flavor = f ? f.flavor_text.replace(/[\n\f\r]/g, " ") : "";
    }

    currentCry = (p.cries && (p.cries.latest || p.cries.legacy)) || null;
    const displayName = shiny ? "✨ " + p.name : p.name;

    resultEl.innerHTML =
      '<div class="result-top">' +
        '<button class="card-btn shiny-btn' + (shiny ? ' active' : '') + '" id="shinyToggle" title="Toggle shiny"><span>✨</span></button>' +
        (currentCry ? '<button class="card-btn cry-btn" id="cry" title="Play cry"><span>🔊</span></button>' : '') +
        '<div class="dexnum">#' + String(p.id).padStart(4, "0") + '</div>' +
        (sprite ? '<img src="' + sprite + '" alt="' + p.name + '" />' : '') +
        '<div class="name">' + displayName + '</div>' +
        (genus ? '<div class="genus">' + genus + '</div>' : '') +
        '<div class="hashline">hash ' + hash + ' → #' + dexId + '</div>' +
      '</div>' +
      (flavor ? '<div class="flavor">"' + flavor + '"</div>' : '') +
      '<div class="types">' + types + '</div>' +
      '<div class="stats">' + stats + '</div>' +
      '<div class="meta">' +
        '<div><div class="k">Height</div><div class="v">' + (p.height / 10) + ' m</div></div>' +
        '<div><div class="k">Weight</div><div class="v">' + (p.weight / 10) + ' kg</div></div>' +
        '<div><div class="k">Base XP</div><div class="v">' + (p.base_experience ?? "—") + '</div></div>' +
      '</div>' +
      '<div class="share-bar"><button class="share-btn" id="share">🔗 Copy share link</button></div>';

    const cryBtn = document.getElementById("cry");
    if (cryBtn) cryBtn.addEventListener("click", playCry);
    const shinyBtn = document.getElementById("shinyToggle");
    if (shinyBtn) shinyBtn.addEventListener("click", () => { shinyState = !shinyState; render(); });
    const shareBtn = document.getElementById("share");
    if (shareBtn) shareBtn.addEventListener("click", copyShareLink);
  }

  function playCry() {
    if (!currentCry) return;
    const audio = new Audio(currentCry);
    audio.volume = 0.4;
    audio.play().catch(() => toast("Couldn't play the cry"));
  }

  // Shareable link
  function copyShareLink() {
    if (!inputValid()) { toast("Fill in a value to share"); return; }
    const params = new URLSearchParams();
    params.set("mode", mode);
    const name = document.getElementById("name").value.trim();
    const bday = document.getElementById("bday").value;
    if (mode !== "bday" && name) params.set("name", name);
    if (mode !== "name" && bday) params.set("bday", bday);
    if (shinyState) params.set("shiny", "1");
    const url = location.origin + location.pathname + "?" + params.toString();
    navigator.clipboard.writeText(url)
      .then(() => toast("Link copied to clipboard"))
      .catch(() => toast("Copy failed — " + url));
  }

  function loadFromUrl() {
    const q = new URLSearchParams(location.search);
    if (![...q.keys()].length) return;
    if (q.get("mode")) setMode(q.get("mode"));
    if (q.get("name")) document.getElementById("name").value = q.get("name");
    if (q.get("bday")) document.getElementById("bday").value = q.get("bday");
    if (q.get("shiny") === "1") shinyState = true;
    if (inputValid()) reveal();
  }

  // Random Pokémon (not from a hash) — shown under the "By You" tab
  function randomPokemon() {
    const id = Math.floor(Math.random() * DEX_MAX) + 1;
    const hash = hashString("random:" + id);
    youResult = { id, hash };
    setTabVisual("you");
    showPokemon(id, hash);
  }

  /* ---------- Explore by generation / region / game ---------- */

  const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  let browseType = "generation";
  let youResult = null;   // last "By You" reveal { id, hash }
  const listCache = {};   // type -> [{value, label}]
  const poolCache = {};   // "type:value" -> [ids]

  const speciesId = url => {
    const m = url.match(/pokemon-species\/(\d+)/);
    return m ? parseInt(m[1], 10) : null;
  };
  const titleCase = s => s.replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase());

  async function getJson(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  // Options for the second dropdown, per type
  async function loadOptions(type) {
    if (listCache[type]) return listCache[type];
    let opts;
    if (type === "generation") {
      const d = await getJson("https://pokeapi.co/api/v2/generation?limit=100");
      opts = d.results.map((g, i) => ({ value: g.name, label: "Generation " + (ROMAN[i] || (i + 1)) }));
    } else if (type === "region") {
      const d = await getJson("https://pokeapi.co/api/v2/region?limit=100");
      opts = d.results.map(r => ({ value: r.name, label: titleCase(r.name) }));
    } else { // game
      const d = await getJson("https://pokeapi.co/api/v2/version-group?limit=100");
      opts = d.results.map(v => ({ value: v.name, label: titleCase(v.name) }));
    }
    listCache[type] = opts;
    return opts;
  }

  // Build a pool of species ids (1..1025) for a given type + value
  async function getPool(type, value) {
    const key = type + ":" + value;
    if (poolCache[key]) return poolCache[key];
    const ids = new Set();

    const addFromGeneration = async (genRef) => {
      const g = await getJson(genRef);
      g.pokemon_species.forEach(s => { const id = speciesId(s.url); if (id) ids.add(id); });
    };
    const addFromPokedexes = async (pokedexes) => {
      for (const pd of pokedexes) {
        try {
          const d = await getJson(pd.url);
          d.pokemon_entries.forEach(e => { const id = speciesId(e.pokemon_species.url); if (id) ids.add(id); });
        } catch (_) { /* skip a bad pokedex */ }
      }
    };

    if (type === "generation") {
      await addFromGeneration("https://pokeapi.co/api/v2/generation/" + value);
    } else if (type === "region") {
      const reg = await getJson("https://pokeapi.co/api/v2/region/" + value);
      if (reg.main_generation) await addFromGeneration(reg.main_generation.url);
      if (!ids.size && reg.pokedexes) await addFromPokedexes(reg.pokedexes);
    } else { // game -> use the game's pokédex roster, fall back to its generation
      const vg = await getJson("https://pokeapi.co/api/v2/version-group/" + value);
      if (vg.pokedexes && vg.pokedexes.length) await addFromPokedexes(vg.pokedexes);
      if (!ids.size && vg.generation) await addFromGeneration(vg.generation.url);
    }

    const pool = [...ids].filter(id => id >= 1 && id <= DEX_MAX).sort((a, b) => a - b);
    poolCache[key] = pool;
    return pool;
  }

  async function populateBrowseValues() {
    const sel = document.getElementById("browseValue");
    sel.innerHTML = "<option>Loading…</option>";
    try {
      const opts = await loadOptions(browseType);
      sel.innerHTML = opts.map(o => '<option value="' + o.value + '">' + o.label + '</option>').join("");
    } catch (e) {
      sel.innerHTML = '<option value="">Couldn\'t load list</option>';
    }
  }

  // Active result tab: "you" | "generation" | "region" | "game"
  let activeTab = "you";

  // Update tab highlight + show the pool picker only on browse tabs (no reveal)
  function setTabVisual(t) {
    activeTab = t;
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
    document.getElementById("subselect").style.display = (t === "you") ? "none" : "flex";
  }

  // Clicking a tab: "By You" restores your reveal; browse tabs load a pool
  async function setTab(t) {
    setTabVisual(t);
    if (t === "you") {
      if (youResult) await showPokemon(youResult.id, youResult.hash);
      else {
        resultEl.className = "result show";
        resultEl.innerHTML = '<div class="msg">Enter your name or birthday above and hit Reveal.</div>';
      }
    } else {
      browseType = t;
      await populateBrowseValues();
      await revealFromPool(true);
    }
  }

  async function revealFromPool(useHash) {
    const value = document.getElementById("browseValue").value;
    if (!value) { toast("Pick an option first"); return; }
    resultEl.className = "result show";
    resultEl.innerHTML = '<div class="msg">Building the pool…</div>';
    try {
      const pool = await getPool(browseType, value);
      if (!pool.length) { resultEl.innerHTML = '<div class="msg">No Pokémon found for that pool.</div>'; return; }
      let idx, hash;
      if (useHash && inputValid()) {
        hash = hashString(buildInput());
        idx = hash % pool.length;             // your destined pick, constrained to this pool
      } else {
        idx = Math.floor(Math.random() * pool.length);
        hash = hashString("pool:" + browseType + ":" + value + ":" + idx);
      }
      await showPokemon(pool[idx], hash);
    } catch (e) {
      resultEl.innerHTML = '<div class="msg">Could not build that pool (' + e.message + ').</div>';
    }
  }

  document.getElementById("tabs").addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (btn) setTab(btn.dataset.tab);
  });
  document.getElementById("browseValue").addEventListener("change", () => revealFromPool(true));
  document.getElementById("browseRand").addEventListener("click", () => revealFromPool(false));

  document.getElementById("go").addEventListener("click", reveal);
  document.getElementById("rand").addEventListener("click", randomPokemon);
  document.querySelectorAll("input[type=text], input[type=date]").forEach(inp => {
    inp.addEventListener("keydown", e => { if (e.key === "Enter") reveal(); });
  });

  // Initial placeholder in the result card
  setTab("you");
  loadFromUrl();
</script>
</body>
</html>
